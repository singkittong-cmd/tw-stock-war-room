# ☁️ 台股雲端排程：每次只跑一輪 --once，不跑長迴圈、不裝瀏覽器。
#   1. 盤中每次排程都由本腳本檢查一次報價與進出場（Streamlit 休眠也照跑），只有實際成交才 commit。
#   2. 盤前川大帝MAGA 早報、收盤結算、新聞 TOP 10 與明日建議買進價。
#   3. 設有 STREAMLIT_APP_URL 時順便送一次輕量 HTTP GET。
# 排程時間是 UTC；台灣時間 = UTC + 8。證交所休市日由 tools/tw_market_calendar.py 判斷，休市日只跑幾秒就結束。
# 估算用量：每個交易日 12 次 × 約 1–2 分鐘 ≈ 每月 300–550 分鐘（私人 repo 免費額度 2,000 分鐘）。
name: tw-market-autopilot

on:
  schedule:
    # GitHub 排程在整點／半點最擁擠，常延遲 1–3 小時（11/18、11/19 的 13:35 收盤排程分別到 16:09、16:11 才執行），
    # 因此分鐘數錯開整點，收盤另加 3 次備援；收盤流程可重複執行（已結算、已出報告就跳過，不重複 commit）。
    # UTC 星期換算：台灣週一 07:38 = UTC 週日 23:38 → 0-4；台灣 09:00 以後與 UTC 同一天 → 1-5。
    - cron: "38 23 * * 0-4"          # 台灣週一至週五 07:38：川大帝MAGA 美股早報（漏掉時 09:00–16:30 自動補課）
    - cron: "4,34 1,2,3,4 * * 1-5"   # 台灣 09:04、09:34 … 12:34：檢查一次報價與進出場
    - cron: "4,24 5 * * 1-5"         # 台灣 13:04、13:24：同上
    - cron: "41 5 * * 1-5"           # 台灣 13:41：收盤結算、新聞 TOP 10、Potential TOP 20 與明日建議買進價
    - cron: "11,41 6 * * 1-5"        # 台灣 14:11、14:41：收盤備援（已完成就只跑幾秒）
    - cron: "17 7 * * 1-5"           # 台灣 15:17：收盤最後備援
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tw-market-autopilot          # 同一時間只跑一個，避免 push 衝突
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      AUTOPILOT_MODE: ${{ vars.AUTOPILOT_MODE || 'cloud_master' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
      STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL || secrets.STREAMLIT_APP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 還原 20 強 K 線／籌碼預抓快取（reports/data 不進 git）
        uses: actions/cache@v4
        with:
          path: reports/data
          key: prefetch-${{ github.run_id }}
          restore-keys: prefetch-

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 設定 git 身分（github-actions bot）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 雲端單次排程（--once）
        run: python tools/cloud_autopilot_tick.py --once
